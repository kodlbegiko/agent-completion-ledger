[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-completion-ledger"
version = "0.3.1"
description = "Repository-level acceptance evidence contracts for coding-agent tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Frontier Public-Interest Research Mission"}]
keywords = [
  "coding agents",
  "acceptance evidence",
  "continuous integration",
  "software verification",
  "reproducibility",
]
dependencies = [
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/kodlbegiko/agent-completion-ledger"
Documentation = "https://github.com/kodlbegiko/agent-completion-ledger#readme"
Changelog = "https://github.com/kodlbegiko/agent-completion-ledger/blob/main/CHANGELOG.md"
Issues = "https://github.com/kodlbegiko/agent-completion-ledger/issues"
Source = "https://github.com/kodlbegiko/agent-completion-ledger"

[project.optional-dependencies]
dev = [
  "build==1.2.2.post1",
  "mypy==1.17.0",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.12.5",
  "types-jsonschema==4.26.0.20260518",
  "types-PyYAML==6.0.12.20260518",
]

[project.scripts]
agent-completion-ledger = "agent_completion_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_completion_ledger = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agent_completion_ledger"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/agent_completion_ledger/reproduction.py" = ["UP036"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_completion_ledger"]
