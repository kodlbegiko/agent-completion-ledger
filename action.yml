name: Agent Completion Ledger
description: Verify repository-level acceptance evidence contracts for coding-agent tasks.
inputs:
  contract:
    description: Path to the completion evidence contract.
    required: false
    default: completion-ledger.yml
  repo-root:
    description: Repository root containing evidence paths.
    required: false
    default: .
  task:
    description: Optional single task id to verify.
    required: false
    default: ""
  format:
    description: terminal, json, markdown, or in-toto.
    required: false
    default: markdown
  output:
    description: Optional report output path.
    required: false
    default: completion-report.md
  expected-contract-sha256:
    description: Optional SHA-256 pin for trusted contract mode.
    required: false
    default: ""
  no-exec:
    description: Disable command assertions and evaluate static evidence only.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install Agent Completion Ledger
      shell: bash
      run: python -m pip install "${GITHUB_ACTION_PATH}"
    - name: Verify completion evidence
      shell: bash
      env:
        ACL_CONTRACT: ${{ inputs.contract }}
        ACL_REPO_ROOT: ${{ inputs.repo-root }}
        ACL_TASK: ${{ inputs.task }}
        ACL_FORMAT: ${{ inputs.format }}
        ACL_OUTPUT: ${{ inputs.output }}
        ACL_EXPECTED_CONTRACT_SHA256: ${{ inputs.expected-contract-sha256 }}
        ACL_NO_EXEC: ${{ inputs.no-exec }}
      run: |
        args=(verify --contract "$ACL_CONTRACT" --repo-root "$ACL_REPO_ROOT" --format "$ACL_FORMAT")
        if [[ -n "$ACL_TASK" ]]; then args+=(--task "$ACL_TASK"); fi
        if [[ -n "$ACL_OUTPUT" ]]; then args+=(--output "$ACL_OUTPUT"); fi
        if [[ -n "$ACL_EXPECTED_CONTRACT_SHA256" ]]; then
          args+=(--expected-contract-sha256 "$ACL_EXPECTED_CONTRACT_SHA256")
        fi
        if [[ "$ACL_NO_EXEC" == "true" ]]; then args+=(--no-exec); fi
        agent-completion-ledger "${args[@]}"
