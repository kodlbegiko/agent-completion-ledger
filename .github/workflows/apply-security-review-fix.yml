name: apply-security-review-fix

on:
  push:
    paths:
      - .github/workflows/apply-security-review-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/external-validation-operations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact security review corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding='utf-8')
              if content.count(old) != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {content.count(old)}')
              target.write_text(content.replace(old, new), encoding='utf-8', newline='\n')

          replace_once(
              'src/agent_completion_ledger/assertions.py',
              'if any(argument.startswith(("http://", "https://")) for argument in spec.command):',
              'if any(argument.lower().startswith(("http://", "https://")) for argument in spec.command):',
          )

          replace_once(
              'tests/test_assertions.py',
              '''def test_remote_url_argument_rejected(repo: Path) -> None:\n    spec = AssertionSpec(\n        "command", "command", command=(sys.executable, "https://example.invalid/code.py")\n    )\n    result = evaluate_assertion(spec, repo, (sys.executable,))\n    assert result.outcome is AssertionOutcome.UNVERIFIABLE\n''',
              '''@pytest.mark.parametrize(\n    "url",\n    [\n        "http://example.invalid/code.py",\n        "https://example.invalid/code.py",\n        "HTTP://example.invalid/code.py",\n        "HTTPS://example.invalid/code.py",\n    ],\n)\ndef test_remote_url_argument_rejected(repo: Path, url: str) -> None:\n    spec = AssertionSpec("command", "command", command=(sys.executable, url))\n    result = evaluate_assertion(spec, repo, (sys.executable,))\n    assert result.outcome is AssertionOutcome.UNVERIFIABLE\n''',
          )

          replace_once(
              'security/reproduction-cases/run_cases.py',
              '''            expected_exit=1,\n            expected_status="FAILED",\n''',
              '''            expected_exit=2,\n            expected_status="UNVERIFIABLE",\n''',
          )

          replace_once(
              'security/reproduction-cases/README.md',
              '''Expected result: the command is rejected before Python receives the `HTTPS://...` argument. Because this is an unsafe assertion that did not satisfy the configured evidence, the task is `FAILED` with exit code `1`. The `.invalid` domain is reserved for examples and must not be contacted.\n\n```bash\nset +e\nagent-completion-ledger verify \\\n  --contract security/reproduction-cases/contracts/remote-url.yml \\\n  --repo-root security/reproduction-cases/repository \\\n  --format json \\\n  --output /tmp/acl-security-review/remote-url.json\nSTATUS=$?\nset -e\ntest "$STATUS" -eq 1\n```\n''',
              '''Expected result: `UNVERIFIABLE` with exit code `2` before Python receives the mixed-case `HTTPS://...` argument. The `.invalid` domain is reserved for examples and must not be contacted.\n\n```bash\nset +e\nagent-completion-ledger verify \\\n  --contract security/reproduction-cases/contracts/remote-url.yml \\\n  --repo-root security/reproduction-cases/repository \\\n  --format json \\\n  --output /tmp/acl-security-review/remote-url.json\nSTATUS=$?\nset -e\ntest "$STATUS" -eq 2\n```\n''',
          )
          PY
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --fix src/agent_completion_ledger/assertions.py tests/test_assertions.py security/reproduction-cases/run_cases.py
      - run: ruff format src/agent_completion_ledger/assertions.py tests/test_assertions.py security/reproduction-cases/run_cases.py
      - run: pytest -q tests/test_assertions.py
      - name: Commit security fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-security-review-fix.yml
          git add -A
          git commit -m "security: reject remote URL arguments case-insensitively"
          git push origin HEAD:research/external-validation-operations
