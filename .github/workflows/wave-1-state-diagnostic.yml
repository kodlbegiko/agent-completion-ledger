name: wave-1-state-diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch and capture first failing test
        run: |
          git clone --depth 1 --branch research/wave-1-first-outreach https://github.com/kodlbegiko/agent-completion-ledger.git repo
          cd repo
          python3 -m pip install -q -e ".[dev]"
          pytest -q -x
