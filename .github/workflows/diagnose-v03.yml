name: diagnose-v03
on:
  push:
    paths:
      - .github/workflows/diagnose-v03.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trusted-evidence-and-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run diagnostics
        shell: bash
        run: |
          set +e
          : > docs/v0.3.0-validation-diagnostics.txt
          record() {
            printf '\n===== %s =====\n' "$1" >> docs/v0.3.0-validation-diagnostics.txt
            shift
            "$@" >> docs/v0.3.0-validation-diagnostics.txt 2>&1
            printf 'EXIT_CODE=%s\n' "$?" >> docs/v0.3.0-validation-diagnostics.txt
          }
          record pip-upgrade python -m pip install --upgrade pip
          record install python -m pip install -e ".[dev]"
          record ruff-check ruff check --output-format=concise .
          record ruff-format ruff format --check .
          record mypy mypy src
          record pytest pytest --cov=agent_completion_ledger --cov-branch --cov-report=term-missing --cov-report=json:coverage.json
          record build python -m build
          record synthetic-analysis python research/external-validation/analyze.py research/external-validation/synthetic-dry-run.csv --output synthetic-analysis-result.json
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v0.3.0-validation-diagnostics.txt coverage.json synthetic-analysis-result.json
          git commit -m "ci: record temporary v0.3 validation diagnostics"
          git push origin HEAD:feat/trusted-evidence-and-validation
