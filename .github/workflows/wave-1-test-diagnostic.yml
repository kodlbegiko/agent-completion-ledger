name: wave-1-test-diagnostic

on:
  push:
    branches: [research/wave-1-external-validation-launch]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Capture pytest output
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pytest -vv > wave-1-pytest.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-1-test-diagnostics
          path: wave-1-pytest.log
          if-no-files-found: error
      - name: Enforce pytest result
        if: always()
        env:
          EXIT_CODE: ${{ steps.pytest.outputs.exit_code }}
        run: test "$EXIT_CODE" = "0"
