name: debug-lint
on:
  push:
    paths:
      - .github/workflows/debug-lint.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trusted-evidence-and-validation
      - uses: astral-sh/ruff-action@v3
        continue-on-error: true
        with:
          args: check --output-format=concise .
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          python -m pip install ruff==0.12.5
          ruff check --output-format=concise . > docs/lint-diagnostics.txt 2>&1
          ruff format --check . >> docs/lint-diagnostics.txt 2>&1
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lint-diagnostics.txt
          git commit -m "ci: record temporary lint diagnostics"
          git push origin HEAD:feat/trusted-evidence-and-validation
