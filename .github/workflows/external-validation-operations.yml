name: external-validation-operations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-operations-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e ".[dev]"

      - name: Parse and inspect distribution workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          publish_path = Path('.github/workflows/publish-pypi.yml')
          release_path = Path('.github/workflows/build-release-artifacts.yml')
          for path in (publish_path, release_path):
              text = path.read_text(encoding='utf-8')
              parsed = yaml.load(text, Loader=yaml.BaseLoader)
              assert isinstance(parsed, dict)
              assert 'pull_request_target' not in text
              assert 'secrets.' not in text
              assert 'password:' not in text

          publish = publish_path.read_text(encoding='utf-8')
          tag_expression = 'ref: ' + '$' + '{{ inputs.tag }}'
          assert 'workflow_dispatch:' in publish
          assert 'description: Existing immutable semver tag to publish' in publish
          assert tag_expression in publish
          assert 'environment: testpypi' in publish
          assert 'environment: pypi' in publish
          assert publish.count('id-token: write') == 2
          assert 'pypa/gh-action-pypi-publish@release/v1' in publish
          assert 'repository-url: https://test.pypi.org/legacy/' in publish
          assert 'checksums/SHA256SUMS' in publish
          assert 'dist/SHA256SUMS' not in publish

          release = release_path.read_text(encoding='utf-8')
          assert 'workflow_dispatch:' in release
          assert 'environment: release-artifacts' in release
          assert 'contents: write' in release
          assert 'SHA256SUMS' in release
          assert 'gh release upload' in release
          PY

      - name: Validate prepared contracts
        run: |
          for contract in security/reproduction-cases/contracts/*.yml; do
            agent-completion-ledger validate-contract "$contract"
          done
          agent-completion-ledger validate-contract \
            research/prospective-dogfood/acl-external-validation-operations/completion-ledger.yml

      - name: Execute benign security review cases
        id: security-cases
        continue-on-error: true
        run: >-
          python security/reproduction-cases/run_cases.py
          --output-dir validation-artifacts/security

      - name: Run author-owned prospective dogfood
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts/prospective-dogfood
          CONTRACT=research/prospective-dogfood/acl-external-validation-operations/completion-ledger.yml
          CONTRACT_SHA="$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' "$CONTRACT")"
          START_NS="$(python -c 'import time; print(time.monotonic_ns())')"
          agent-completion-ledger verify \
            --contract "$CONTRACT" \
            --repo-root . \
            --expected-contract-sha256 "$CONTRACT_SHA" \
            --no-exec \
            --format json \
            --output validation-artifacts/prospective-dogfood/report.json
          END_NS="$(python -c 'import time; print(time.monotonic_ns())')"
          agent-completion-ledger report \
            validation-artifacts/prospective-dogfood/report.json \
            --format markdown \
            --output validation-artifacts/prospective-dogfood/report.md

          START_NS="$START_NS" END_NS="$END_NS" python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          contract_path = Path(
              'research/prospective-dogfood/acl-external-validation-operations/completion-ledger.yml'
          )
          contract = yaml.safe_load(contract_path.read_text(encoding='utf-8'))
          report = json.loads(
              Path('validation-artifacts/prospective-dogfood/report.json').read_text(
                  encoding='utf-8'
              )
          )
          assert report['overallStatus'] == 'SUPPORTED'
          assertions = sum(len(task['evidence']) for task in contract['tasks'])
          noncomment_lines = sum(
              1
              for line in contract_path.read_text(encoding='utf-8').splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          )
          result = {
              'recordStatus': 'AUTHOR-OWNED PROSPECTIVE DOGFOOD',
              'repository': 'kodlbegiko/agent-completion-ledger',
              'branch': 'research/external-validation-operations',
              'aclVersion': '0.3.0',
              'contractCreatedBeforeImplementationCompletion': True,
              'contractAuthoringMinutes': None,
              'contractAuthoringMeasurement': 'PENDING MANUAL TIMER; not inferred or fabricated',
              'contractLineCount': noncomment_lines,
              'assertionCount': assertions,
              'verificationRuntimeSeconds': (
                  int(os.environ['END_NS']) - int(os.environ['START_NS'])
              ) / 1_000_000_000,
              'decisionBeforeLedger': 'INSUFFICIENT_EVIDENCE',
              'ledgerResult': report['overallStatus'],
              'decisionAfterLedger': 'ELIGIBLE_FOR_REVIEW; merge decision remains human',
              'decisionChanged': False,
              'missingBlockingEvidenceFound': False,
              'externalValidationCredit': False,
              'resultDigest': report['resultDigest'],
          }
          Path('validation-artifacts/prospective-dogfood/metrics.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-validation-operations-evidence
          path: validation-artifacts/
          if-no-files-found: error

      - name: Enforce benign security case success
        if: always()
        env:
          SECURITY_CASES_OUTCOME: ${{ steps.security-cases.outcome }}
        shell: bash
        run: test "$SECURITY_CASES_OUTCOME" = "success"
