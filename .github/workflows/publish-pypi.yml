name: publish-package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable semver tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and validate tagged distributions
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested tag syntax
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches checked-out commit and package version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git show-ref --verify --quiet "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          test "$TAG" = "v$PACKAGE_VERSION"

      - name: Build, render-check, and smoke-test
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.2.2.post1 twine==6.1.0
          python -m build
          python -m twine check dist/*
          python scripts/wheel_smoke.py "$(python -c 'import glob; print(glob.glob("dist/*.whl")[0])')"

      - name: Generate SHA-256 checksums outside the publication directory
        shell: bash
        run: |
          mkdir -p checksums
          python - <<'PY'
          import hashlib
          from pathlib import Path

          lines = []
          for path in sorted(Path('dist').iterdir()):
              if path.is_file():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {path.name}")
          Path('checksums/SHA256SUMS').write_text(
              '\n'.join(lines) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-checksums
          path: checksums/SHA256SUMS
          if-no-files-found: error

  publish-testpypi:
    name: Publish tagged distributions to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

  publish-pypi:
    name: Publish identical tagged distributions to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
