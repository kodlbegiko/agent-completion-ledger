name: format-final-v03
on:
  push:
    paths:
      - .github/workflows/format-final-v03.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trusted-evidence-and-validation
      - run: python -m pip install ruff==0.12.5
      - run: ruff check --fix .
      - run: ruff format .
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: apply final v0.3 formatting"
            git push origin HEAD:feat/trusted-evidence-and-validation
          fi
