name: mypy-diagnostic
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Capture mypy output
        shell: bash
        run: |
          set +e
          mypy src > mypy.txt 2>&1
          echo $? > mypy-exit.txt
          set -e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mypy-diagnostics
          path: |
            mypy.txt
            mypy-exit.txt
