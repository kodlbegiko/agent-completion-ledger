name: format-final-external-operations

on:
  push:
    paths:
      - .github/workflows/format-final-external-operations.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/external-validation-operations
      - run: python -m pip install ruff==0.12.5
      - run: ruff check --fix .
      - run: ruff format .
      - name: Commit formatter output and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-final-external-operations.yml
          git add -A
          git commit -m "style: apply final external operations formatting"
          git push origin HEAD:research/external-validation-operations
