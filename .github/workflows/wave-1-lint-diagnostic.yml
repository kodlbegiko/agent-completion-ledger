name: wave-1-lint-diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Capture Ruff fix diff
        shell: bash
        run: ruff check --fix --diff . > wave-1-ruff.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-1-lint-fix-diff
          path: wave-1-ruff.log
          if-no-files-found: error
