name: wave-1-lint-diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Capture Ruff output
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ruff check --output-format=concise . > wave-1-ruff.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-1-lint-diagnostics
          path: wave-1-ruff.log
          if-no-files-found: error
      - name: Enforce Ruff result
        if: always()
        env:
          EXIT_CODE: ${{ steps.ruff.outputs.exit_code }}
        run: test "$EXIT_CODE" = "0"
