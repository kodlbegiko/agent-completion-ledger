name: edit-release-title-v0.2.0

on:
  push:
    paths:
      - .github/workflows/edit-release-title-v0.2.0.yml

permissions:
  contents: write

jobs:
  edit-release-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Edit and verify v0.2.0 release title
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: v0.2.0 — Generic Completion Evidence Contract
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v0.2.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TITLE}"

          RELEASE_JSON="$(gh release view v0.2.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --json name,url,tagName,isDraft,isPrerelease)"

          test "$(jq -r '.name' <<<"${RELEASE_JSON}")" = "${RELEASE_TITLE}"
          printf '%s\n' "${RELEASE_JSON}" | jq '.' > docs/release-title-status-v0.2.0.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release-title-status-v0.2.0.json
          git commit -m "docs: record v0.2.0 release title"
          git push origin HEAD:main
