name: publish-v0.2.0

on:
  push:
    paths:
      - .github/workflows/publish-v0.2.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish v0.2.0 tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: cc47d9ee309f801135825a5ed1a4417110542690
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_SHA}^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin refs/tags/v0.2.0 >/dev/null 2>&1; then
            echo "Tag v0.2.0 already exists"
          else
            git tag -a v0.2.0 "${TARGET_SHA}" -m "Agent Completion Ledger v0.2.0"
            git push origin v0.2.0
          fi

          TAG_SHA="$(git rev-list -n 1 v0.2.0)"
          test "${TAG_SHA}" = "${TARGET_SHA}"

          if gh release view v0.2.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists"
          else
            gh release create v0.2.0 \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "Agent Completion Ledger v0.2.0" \
              --notes-file docs/release-notes-v0.2.0.md
          fi

          gh release view v0.2.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --json url,tagName,targetCommitish,isDraft,isPrerelease
