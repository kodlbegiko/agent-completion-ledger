name: v0.3.1-package-diagnostic

on:
  push:
    branches: [release/v0.3.1]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture editable-install diagnostics
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pip install -e ".[dev]" > package-install.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.3.1-package-diagnostics
          path: package-install.log
          if-no-files-found: error
      - name: Enforce install result
        if: always()
        env:
          EXIT_CODE: ${{ steps.install.outputs.exit_code }}
        run: test "$EXIT_CODE" = "0"
