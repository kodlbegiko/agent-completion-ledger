name: windows-diagnostic
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Capture pytest output
        shell: pwsh
        run: |
          pytest --cov=agent_completion_ledger --cov-branch --cov-report=term-missing *> pytest-windows.txt
          $LASTEXITCODE | Out-File -Encoding utf8 pytest-windows-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-pytest-diagnostics
          path: |
            pytest-windows.txt
            pytest-windows-exit.txt
