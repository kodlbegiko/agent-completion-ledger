name: actionlint-diagnostic
on:
  push:
    paths:
      - .github/workflows/actionlint-diagnostic.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trusted-evidence-and-validation
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run actionlint
        shell: bash
        run: |
          set +e
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color=false .github/workflows/ci.yml > docs/actionlint-diagnostic.txt 2>&1
          printf '\nEXIT_CODE=%s\n' "$?" >> docs/actionlint-diagnostic.txt
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/actionlint-diagnostic.txt
          git commit -m "ci: record temporary actionlint diagnostics"
          git push origin HEAD:feat/trusted-evidence-and-validation
# diagnostic revision 4
