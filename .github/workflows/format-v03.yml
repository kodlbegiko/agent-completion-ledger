name: format-v03
on:
  push:
    paths:
      - .github/workflows/format-v03.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trusted-evidence-and-validation
      - run: python -m pip install ruff==0.12.5
      - run: ruff check --fix .
      - run: ruff format .
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply v0.3 release formatting"
          git push origin HEAD:feat/trusted-evidence-and-validation
