name: ruff-autofix
on:
  pull_request:
permissions:
  contents: write
jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/ruff-action@v3
        with:
          args: --version
      - name: Apply and capture Ruff fixes
        shell: bash
        run: |
          set +e
          ruff check --fix . > ruff-check.txt 2>&1
          echo $? > ruff-check-exit.txt
          ruff format . > ruff-format.txt 2>&1
          echo $? > ruff-format-exit.txt
          set -e
      - name: Commit Ruff changes
        run: |
          if git diff --quiet; then
            echo "No Ruff changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!ruff-check.txt' ':!ruff-check-exit.txt' ':!ruff-format.txt' ':!ruff-format-exit.txt'
          git commit -m "style: apply ruff fixes for v0.2.0"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruff-diagnostics
          path: |
            ruff-check.txt
            ruff-check-exit.txt
            ruff-format.txt
            ruff-format-exit.txt
