name: publish-v0.3.0
on:
  push:
    paths:
      - .github/workflows/publish-v0.3.0.yml
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for clean-main CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ce8ffb7597209428d050880907f5ccccaefc95f0
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 120); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch main \
              --event push \
              --limit 50 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" \
              | head -n 1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "No matching main CI run found for $TARGET_SHA" >&2
            exit 2
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,url,headSha,event,status,conclusion,workflowName,jobs \
            > /tmp/ci-run.json
          test "$(jq -r '.conclusion' /tmp/ci-run.json)" = "success"
          test "$(jq -r '.headSha' /tmp/ci-run.json)" = "$TARGET_SHA"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download validation artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
        shell: bash
        run: |
          mkdir -p /tmp/quality
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name quality-ubuntu-latest-py3.12 \
            --dir /tmp/quality
      - name: Create and verify release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ce8ffb7597209428d050880907f5ccccaefc95f0
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git cat-file -e "${TARGET_SHA}^{commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin refs/tags/v0.3.0 >/dev/null 2>&1; then
            echo "Tag v0.3.0 already exists"
          else
            git tag -a v0.3.0 "$TARGET_SHA" -m "Agent Completion Ledger v0.3.0"
            git push origin v0.3.0
          fi

          git fetch --force --tags origin
          TAG_SHA="$(git rev-list -n 1 v0.3.0)"
          test "$TAG_SHA" = "$TARGET_SHA"

          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.3.0 already exists"
          else
            gh release create v0.3.0 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "v0.3.0 — Trusted Acceptance Evidence" \
              --notes-file docs/release-notes-v0.3.0.md
          fi

          gh release view v0.3.0 \
            --repo "$GITHUB_REPOSITORY" \
            --json name,url,tagName,targetCommitish,isDraft,isPrerelease,publishedAt \
            > /tmp/release.json
          test "$(jq -r '.name' /tmp/release.json)" = "v0.3.0 — Trusted Acceptance Evidence"
          test "$(jq -r '.tagName' /tmp/release.json)" = "v0.3.0"
          test "$(jq -r '.isDraft' /tmp/release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/release.json)" = "false"
      - name: Record verified release status
        env:
          TARGET_SHA: ce8ffb7597209428d050880907f5ccccaefc95f0
        shell: bash
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ci = json.loads(Path('/tmp/ci-run.json').read_text(encoding='utf-8'))
          release = json.loads(Path('/tmp/release.json').read_text(encoding='utf-8'))
          coverage = json.loads(Path('/tmp/quality/coverage.json').read_text(encoding='utf-8'))
          root = ET.parse('/tmp/quality/junit.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          junit = {
              key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
              for key in ('tests', 'failures', 'errors', 'skipped')
          }
          totals = coverage['totals']
          jobs = [
              {'name': job['name'], 'conclusion': job.get('conclusion')}
              for job in ci.get('jobs', [])
          ]
          payload = {
              'schemaVersion': '1',
              'targetCommit': 'ce8ffb7597209428d050880907f5ccccaefc95f0',
              'resolvedTagCommit': 'ce8ffb7597209428d050880907f5ccccaefc95f0',
              'release': release,
              'ci': {
                  'runId': ci['databaseId'],
                  'url': ci['url'],
                  'event': ci['event'],
                  'conclusion': ci['conclusion'],
                  'headSha': ci['headSha'],
                  'jobs': jobs,
                  'tests': junit,
                  'coverage': {
                      'combinedPercent': totals['percent_covered'],
                      'statementPercent': totals['percent_statements_covered'],
                      'branchPercent': totals['percent_branches_covered'],
                      'coveredLines': totals['covered_lines'],
                      'statements': totals['num_statements'],
                      'coveredBranches': totals['covered_branches'],
                      'branches': totals['num_branches'],
                  },
              },
              'externalValidation': {
                  'status': 'EXTERNAL VALIDATION PENDING',
                  'realParticipantCount': 0,
                  'nonAuthorIntegrationCount': 0,
              },
              'package': {
                  'pypiPublished': False,
                  'githubReleaseAssets': 'generated source archives only',
              },
          }
          Path('docs/release-status-v0.3.0.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          git add docs/release-status-v0.3.0.json
          git commit -m "docs: record verified v0.3.0 release"
          git push origin HEAD:main
