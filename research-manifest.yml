commands:
  install: 'python -m pip install -e ".[dev]"'
  lint: 'ruff check .'
  format: 'ruff format --check .'
  typecheck: 'mypy src'
  test: 'pytest --cov'
  build: 'python -m build'
  reproduce: >-
    PYTHONHASHSEED=0 agent-completion-ledger benchmark
    --output-dir reproduced-results
  red_team: 'PYTHONPATH=src python scripts/red_team.py'
  fetch_sources: 'python scripts/fetch_public_results.py'
  extract_sources: 'PYTHONPATH=src python scripts/extract_source_counts.py'
expected_outputs:
  summary.json: 7ee038eeff5eb11d1572e503c855b1627aa1bb026491b9f040120b04fd025a2d
  submission-metrics.csv: 270cc9710dabae05dcbecaf537760634ed45b49d7b0679ffed4435b591961edd
  ledger.jsonl: 4fed93e6fe417f6ef680b40ea85f120c897742ebd1ad2816641eb075c7ef1515
  sensitivity.json: 0008af6a2ef7d3545ea45caf95c19ff9ec0af464b308a0df39e751509562968b
  red-team-sensitivity.json: 6483a31b422e10ca54a498fde7110e1ff1f46ae4b43172d786c7f12565110891
metrics:
  primary: inclusive_oracle_unsupported_completion_label_rate
  secondary:
    - strict_false_completion_rate
    - baseline_completion_precision
    - ledger_completion_precision_relative_to_oracle
    - wilson_95_interval
    - submissions_above_threshold
    - leave_one_submission_out_rate
    - oracle_reclassification_break_even
stopping_rule:
  minimum_generated_claims: 3000
  support_conditions:
    - aggregate_wilson_lower_bound_gt_0.20
    - at_least_5_of_7_submissions_gt_0.20
    - minimum_claims_met
