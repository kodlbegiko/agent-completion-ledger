  deterministic_hash_seeds: [0, 321]
known_limitations:
  - generated patch is a behavioral proxy, not a natural-language completion statement
  - the primary rate is the complement of oracle support among generated attempts
  - SWE-bench oracle can be weak, incomplete, or vulnerable
  - purposive sample from one agent lineage and benchmark family
  - repeated tasks across submissions are not independent population draws
  - compact records do not identify exact failed instances without a task universe
  - generic evidence-ledger concepts already exist
