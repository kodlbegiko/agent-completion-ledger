schema_version: "0.1.0"
research_question: >-
  Across seven fixed public SWE-agent submissions to SWE-bench Verified, how often
  is a patch-exists completion label unsupported by the executable oracle, and can
  evidence-gated status reporting eliminate unsupported COMPLETED labels relative
  to that oracle?
status: SUPPORTED
study_type: exploratory benchmark
frozen_date: "2026-07-24"
timezone: Asia/Taipei
random_seed: 0
sample_rule: >-
  Seven named historical SWE-agent Verified folders in the preregistered protocol;
  no post-result sample changes.
